name: Contrats Cucumber

# Déclenchement manuel uniquement, depuis l'onglet Actions.
on:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler et exécuter les contrats
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon
      - name: Conserver le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: build/reports/tests/test
