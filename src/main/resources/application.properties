spring.application.name=car-hms

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/carhms}
spring.datasource.username=${DB_USERNAME:carhms}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false